[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uptempo"
version = "0.1.0"
description = "Symphony-based coding agent that generates network schema files from Linear issues"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.38,<2",
    "structlog>=24.1,<25",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "python-liquid>=1.12,<2",
    "pyyaml>=6.0,<7",
    "python-frontmatter>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "black>=24,<25",
    "isort>=5.13,<6",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uptempo"]

# ── Ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["uptempo"]

# ── Black ────────────────────────────────────────────────────────────
[tool.black]
target-version = ["py311"]
line-length = 99

# ── isort ────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["uptempo"]
src_paths = ["src", "tests"]

# ── mypy ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["liquid.*", "frontmatter.*", "streamlit.*"]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=src/uptempo --cov-report=term-missing"
